name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  content:
    name: 内容与引擎自检
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 这些脚本是纯 Node、不依赖 Electron / 浏览器，也不需要 npm install
      - name: 全站内容一致性（id 唯一、变量闭合、ref 有效、专题归属、幂等）
        run: node _dev/check-all.js

      - name: eNSP 分片（id 冲突、变量未定义、拓扑越界、预设 ref、工作流 end）
        run: node _dev/check-ensp.js

      # 皮肤包：每套皮肤的选择器/变量是否写全，--hud-rgb 与 --bg 是否一致。
      # 最后那条最容易漏 —— 它错了不会报错，只会让透明悬浮窗带上不属于该皮肤的底色。
      - name: 皮肤包（选择器、60 个颜色变量、--hud-rgb 与 --bg 一致性）
        run: node _dev/check-skins.js

      - name: 配置剧本（全角符号、视图链、who 连续性）
        run: node _dev/check-recipes.js

      - name: 下一步引擎（视图识别、回显清洗、41 条主线批量回推）
        run: node _dev/check-nextstep.js

      - name: 搜索（25 个查询 + 首条结果断言）
        run: node _dev/check-search.js

      - name: 知识包导入全链路（校验 → 查重 → 写入 → 合并 → 可见）
        run: node _dev/check-import.js

      - name: 命令词典覆盖率（信息性，列出代码里用到但词典没收的词）
        run: node _dev/check-cmd-coverage.js
